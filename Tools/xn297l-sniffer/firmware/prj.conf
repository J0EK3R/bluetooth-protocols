# --- USB CDC ACM (virtual COM port) -----------------------------------------
# The dongle shows up as a serial port; all commands and packet reports
# are exchanged as text lines over this port.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_MANUFACTURER="bluetooth-protocols"
CONFIG_USB_DEVICE_PRODUCT="XN297L Sniffer"
# USB is enabled from main() (usb_enable), not automatically at boot
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Needed to read the DTR line (only send data while a host has the port open)
CONFIG_UART_LINE_CTRL=y

# --- No Bluetooth stack: the RADIO is driven directly ------------------------
CONFIG_BT=n

# --- LEDs ---------------------------------------------------------------------
CONFIG_GPIO=y

# --- Keep the USB/UART path quiet (no log output mixed into the data stream) --
CONFIG_LOG=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n

# --- Output format for the UF2 bootloader (drag & drop flashing) -------------
# The board links the application at 0x1000 (after the Nordic MBR), which is
# where the factory UF2 bootloader of the dongle expects it.
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_BUILD_OUTPUT_UF2_FAMILY_ID="0xADA52840"

# --- Stack sizes ---------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=2048
